<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true">V</div>
    <h1>Регистрация</h1>
    <p class="hint">Заполните все поля. Данные будут проверены в браузере и на сервере.</p>
    <form id="registerForm" novalidate>
      <label>
        Имя
        <input name="name" type="text" autocomplete="name" placeholder="Иван Петров">
        <span class="error" data-error-for="name"></span>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" placeholder="ivan@example.ru">
        <span class="error" data-error-for="email"></span>
      </label>
      <label>
        Пароль
        <input name="password" type="password" autocomplete="new-password" placeholder="Password1">
        <span class="error" data-error-for="password"></span>
      </label>
      <label>
        Возраст
        <input name="age" type="number" inputmode="numeric" min="18" max="120" placeholder="18">
        <span class="error" data-error-for="age"></span>
      </label>
      <label>
        Телефон
        <input name="phone" type="tel" autocomplete="tel" placeholder="+7 999 123-45-67">
        <span class="error" data-error-for="phone"></span>
      </label>
      <button type="submit">Зарегистрироваться</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
